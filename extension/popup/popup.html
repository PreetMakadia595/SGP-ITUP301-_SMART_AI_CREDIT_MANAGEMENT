<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart AI Credit Advisor Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div class="title">
      <h1>AI Credit Advisor</h1>
      <p>Hybrid Usage Tracker</p>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-title">Backend Connection</div>
      <div class="form-group">
        <label for="backendUrl">API Endpoint</label>
        <input type="text" id="backendUrl" value="http://localhost:8000/api/v1">
      </div>
      <div class="form-group">
        <label for="jwtToken">JWT Auth Token</label>
        <input type="password" id="jwtToken" placeholder="Paste your JWT access token">
      </div>
      <button id="saveBtn" class="btn primary">Save & Connect</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card">
      <div class="card-title">Active Site Tracker</div>
      <div class="stat-row">
        <span>Supported Sites:</span>
        <span class="badge">7 AI Apps</span>
      </div>
      <div class="sites-grid">
        <span class="tag">ChatGPT</span>
        <span class="tag">Claude</span>
        <span class="tag">Gemini</span>
        <span class="tag">Perplexity</span>
        <span class="tag">Cursor</span>
        <span class="tag">Bolt</span>
        <span class="tag">Lovable</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Latest Sync Event</div>
      <div id="lastEventContainer" class="last-event">
        <p class="muted">No events recorded yet in this session.</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
